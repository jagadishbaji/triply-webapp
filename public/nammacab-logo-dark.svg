<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f279"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f279" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (64x64 centered at x=8, y=8) -->
  <g transform="translate(8, 8) scale(0.125)">
    <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)"/>
    <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#rim)" stroke-width="14"/>
    <rect x="130" y="116" width="68" height="280" rx="34" fill="url(#primary)"/>
    <path d="M 170 116 L 286 116 C 360 116 404 154 404 218 C 404 280 358 316 286 316 L 170 316 Z" fill="none" stroke="url(#primary)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 264 286 L 368 396" fill="none" stroke="url(#primary)" stroke-width="64" stroke-linecap="round"/>
    <rect x="148" y="140" width="18" height="232" rx="9" fill="url(#accent)" opacity="0.9"/>
    <circle cx="390" cy="116" r="28" fill="#00f279"/>
    <circle cx="390" cy="116" r="14" fill="#ffffff"/>
  </g>

  <!-- Wordmark RIDEVO -->
  <text x="88" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#ffffff">RIDE<tspan fill="#00f279">VO</tspan></text>
  <text x="90" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="3" fill="#10b981">HUBLI OUTSTATION FLEET</text>
</svg>
