<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NammaCAB – Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0f1e;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 2rem;
      letter-spacing: -0.02em;
    }
    .logo span { color: #00c853; }
    .icon {
      width: 80px;
      height: 80px;
      background: rgba(0,200,83,0.1);
      border: 2px solid rgba(0,200,83,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: #94a3b8; line-height: 1.6; max-width: 320px; margin-bottom: 2rem; }
    button {
      background: #00c853;
      color: #000;
      border: none;
      padding: 0.875rem 2rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #00e676; }
  </style>
</head>
<body>
  <div class="logo">namma<span>CAB</span></div>
  <div class="icon">📡</div>
  <h1>You're Offline</h1>
  <p>No internet connection. Some features may be unavailable. Please check your network and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
